name: Update data.js from Google Sheets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate data.js
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GID_CONFIG: ${{ secrets.GID_CONFIG }}
          GID_CATEGORIAS: ${{ secrets.GID_CATEGORIAS }}
          GID_PRODUTOS: ${{ secrets.GID_PRODUTOS }}
          OUTPUT_PATH: js/data.js
        run: node scripts/generate-data.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add js/data.js
          
          if git diff --staged --quiet; then
            echo "Nenhuma alteração no js/data.js"
          else
            git commit -m "chore: atualiza js/data.js a partir da planilha Google Sheets [skip ci]"
            git push
            echo "✅ js/data.js atualizado e commitado com sucesso"
          fi
